<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 469" width="760" height="469" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="title">Status line and summary (concept)</title>
  <desc id="desc">The status line reads fix-bug, 4 of 5, 1 waived. The summary below the final answer lists each step as satisfied or waived, with its evidence or reason, and would show any released steps.</desc>
  <rect x="0.5" y="0.5" width="759" height="121" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="24" y="49" font-size="24" font-weight="600" fill="#1f2328">In the status line</text>
  <text x="736" y="49" font-size="20" font-weight="600" fill="#59636e" text-anchor="end">Concept</text>
  <text x="24" y="89" font-size="20" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fix-bug · 4/5 · 1 waived</text>
  <rect x="0.5" y="146.5" width="759" height="322" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="24" y="195" font-size="24" font-weight="600" fill="#1f2328">Below the final answer</text>
  <text x="736" y="195" font-size="20" font-weight="600" fill="#59636e" text-anchor="end">Concept</text>
  <text x="24" y="235" font-size="20" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">S1 Reproduce the bug</text>,<text x="328" y="235" font-size="20" fill="#0a5fc2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">satisfied</text>
  <text x="24" y="265" font-size="20" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">S2 Write the fix</text>,<text x="328" y="265" font-size="20" fill="#0a5fc2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">satisfied</text>
  <text x="24" y="295" font-size="20" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">S3 Run the test suite</text>,<text x="328" y="295" font-size="20" fill="#0a5fc2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">satisfied: npm test, exit 0</text>
  <text x="24" y="325" font-size="20" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">S4 Update the changelog</text>,<text x="328" y="325" font-size="20" fill="#0a5fc2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">satisfied</text>
  <text x="24" y="355" font-size="20" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">S5 Update the docs</text>,<text x="328" y="355" font-size="20" font-weight="700" fill="#a84300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">waived: no docs cover this</text>
  <line x1="24" x2="736" y1="376.5" y2="376.5" stroke="#d1d9e0"/>
  <text x="24" y="408" font-size="20" fill="#1f2328">If a stop had been released, this summary would say so:</text>
  <text x="24" y="436" font-size="20" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">released: S3, S5 unverified</text>
