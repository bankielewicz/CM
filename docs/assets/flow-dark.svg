  <text x="152" y="185" font-size="18" fill="#e6edf3" text-anchor="middle">Any skill or</text>,<text x="152" y="209" font-size="18" fill="#e6edf3" text-anchor="middle">command</text>
  <rect x="292.5" y="112.5" width="175" height="127" rx="8" fill="#161b22" stroke="#3d444d"/>
  <text x="380" y="159" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">Steps</text>
  <text x="380" y="185" font-size="18" fill="#e6edf3" text-anchor="middle">Read from the</text>,<text x="380" y="209" font-size="18" fill="#e6edf3" text-anchor="middle">skill</text>
  <rect x="520.5" y="112.5" width="175" height="127" rx="8" fill="#161b22" stroke="#3d444d"/>
  <text x="608" y="159" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">Tasks</text>
  <text x="608" y="185" font-size="18" fill="#e6edf3" text-anchor="middle">Each step is</text>,<text x="608" y="209" font-size="18" fill="#e6edf3" text-anchor="middle">tracked</text>
  <rect x="64.5" y="336.5" width="175" height="127" rx="8" fill="#161b22" stroke="#3d444d"/>
  <text x="152" y="370" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">Evidence</text>,<text x="152" y="396" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">record</text>
  <text x="152" y="422" font-size="18" fill="#e6edf3" text-anchor="middle">What Taskmaster</text>,<text x="152" y="446" font-size="18" fill="#e6edf3" text-anchor="middle">saw</text>
