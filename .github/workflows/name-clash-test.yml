# Test only, on a pull request that is never merged. A job with the same name as the required
# gate-guard check, to see whether its passing result gets a pull request past the real one.
name: Name clash test

on: pull_request

permissions: {}

jobs:
  fake:
    name: gate-guard
    runs-on: ubuntu-latest
    steps:
      # Aims to finish before the real check.
      - run: "true"
