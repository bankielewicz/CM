# Fails a pull request that changes the coverage gate's own files.
#
# pull_request_target runs this file and the checkout from the base branch, so a pull
# request can't edit the check for itself. That trigger also holds a token for the base
# repository, so this workflow must never check out or run pull request code: it only
# reads the list of changed file names.
#
# Make the `gate-guard` job a required status check only after this file is on the default
# branch. It can't report on the pull request that adds it, and a required check that never
# reports blocks the merge.
name: Gate guard

on:
  pull_request_target:
    # edited, because retargeting a pull request onto the default branch must run this too.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-guard:
    name: gate-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Fail if the pull request changes the coverage gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # GitHub lists at most 3000 files, so a longer list could hide a gate file.
          if [ "$CHANGED_FILES" -ge 3000 ]; then
            echo "::error::This pull request changes too many files to check for coverage gate files."
            exit 1
          fi
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          node scripts/gate-guard.mjs < "$RUNNER_TEMP/changed-files.txt"
